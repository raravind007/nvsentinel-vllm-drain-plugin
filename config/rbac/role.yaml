---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests/status
  verbs:
  - get
  - patch
  - update
