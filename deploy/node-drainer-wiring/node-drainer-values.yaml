# NVSentinel node-drainer Helm values. customDrain hands the drain step for
# matching nodes to this plugin instead of node-drainer's built-in eviction;
# see docs/configuration/node-drainer.md#scoping-custom-drain-to-part-of-the-cluster
# in the NVSentinel repo.
#
# nodeSelector below scopes custom drain to GPU inference nodes only, so
# userNamespaces stays configured for every other node in the cluster.
node-drainer:
  userNamespaces:
    - name: "*"
      mode: "AllowCompletion"

  customDrain:
    enabled: true
    nodeSelector: "workload-type=vllm-inference"
    templateConfigMapName: "vllm-drain-template"
    templateMountPath: "/etc/drain-template"
    templateFileName: "drain-template.yaml"
    namespace: "nvsentinel"
    apiGroup: "nvsentinel.nvidia.com"
    version: "v1alpha1"
    kind: "DrainRequest"
    resource: "drainrequests"
    statusConditionType: "DrainComplete"
    statusConditionStatus: "True"
    # MUST exceed the plugin's full worst-case runtime, or node-drainer gives up
    # waiting on the DrainRequest before the plugin finishes. The plugin only
    # reports DrainComplete once the pod has actually disappeared — for the
    # graceful path that's QUIESCE_DEADLINE (120s, the plugin's default) PLUS
    # the pod's own terminationGracePeriodSeconds (90s in this example: see
    # README.md's "Native vLLM shutdown" section — it must itself exceed the
    # preStop delay + vLLM's --shutdown-timeout), plus margin for API latency
    # and the plugin's own poll interval. 120 + 90 = 210; 300 leaves ~90s of
    # margin. This is NOT QUIESCE_DEADLINE + FORCE_DELETE_GRACE_PERIOD_SECONDS
    # (the forced path, usually the smaller of the two) — size this against
    # whichever path is actually slower for your configuration, and keep it in
    # sync by hand if QUIESCE_DEADLINE or terminationGracePeriodSeconds change.
    timeout: "300"
