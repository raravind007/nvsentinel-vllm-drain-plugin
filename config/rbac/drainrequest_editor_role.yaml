# This rule is not used by the project vllm-drain-plugin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the nvsentinel.nvidia.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vllm-drain-plugin
    app.kubernetes.io/managed-by: kustomize
  name: drainrequest-editor-role
rules:
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests/status
  verbs:
  - get
