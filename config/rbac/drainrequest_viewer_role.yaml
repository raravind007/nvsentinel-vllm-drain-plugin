# This rule is not used by the project vllm-drain-plugin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nvsentinel.nvidia.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vllm-drain-plugin
    app.kubernetes.io/managed-by: kustomize
  name: drainrequest-viewer-role
rules:
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests/status
  verbs:
  - get
