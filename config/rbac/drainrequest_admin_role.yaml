# This rule is not used by the project vllm-drain-plugin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over nvsentinel.nvidia.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vllm-drain-plugin
    app.kubernetes.io/managed-by: kustomize
  name: drainrequest-admin-role
rules:
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests
  verbs:
  - '*'
- apiGroups:
  - nvsentinel.nvidia.com
  resources:
  - drainrequests/status
  verbs:
  - get
